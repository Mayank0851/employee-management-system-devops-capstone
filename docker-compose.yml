services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ems-app:local
    container_name: ems-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - database
    volumes:
      - app-data:/usr/src/app
    networks:
      - app-network
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: ems-database
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  database-data:
    driver: local

networks:
  app-network:
    driver: bridge