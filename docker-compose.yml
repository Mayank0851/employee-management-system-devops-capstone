services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-management-system:v1
    container_name: employee-app

    restart: unless-stopped

    environment:
      DJANGO_SECRET_KEY: "change-this-secret-key"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,65.0.81.145"

      DB_ENGINE: "django.db.backends.mysql"
      DB_NAME: "emsdb"
      DB_USER: "emsuser"
      DB_PASSWORD: "emspassword"
      DB_HOST: "database"
      DB_PORT: "3306"

    ports:
      - "8000:8000"

    depends_on:
      - database

    volumes:
      - app-data:/app

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/hello/"]
      interval: 30s
      timeout: 10s
      retries: 3

  database:
    image: mysql:8.0
    container_name: mysql-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: emsdb
      MYSQL_USER: emsuser
      MYSQL_PASSWORD: emspassword
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - database-data:/var/lib/mysql

    networks:
      - app-network

volumes:
  app-data:
  database-data:

networks:
  app-network:
    driver: bridge
